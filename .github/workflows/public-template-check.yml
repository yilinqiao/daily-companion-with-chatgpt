name: Public template integrity and privacy heuristics
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static-check:
    # Initialized private copies are vaults, not blank public templates.
    if: ${{ github.repository == 'yilinqiao/daily-companion-with-chatgpt' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Static release check
        run: python3 scripts/check_public_release.py
      - name: Version and release-notes check
        # Feature branches are checked against their complete PR base.
        if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 -B scripts/check_release_version.py --base "$BASE_SHA"
      - name: Regression checks
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
